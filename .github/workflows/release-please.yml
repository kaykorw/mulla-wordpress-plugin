name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # Opens/updates a release PR from Conventional Commits. Merging it tags vX.Y.Z and creates the GitHub release.
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # A PAT (or GitHub App token) lets CI run on the release PR; GITHUB_TOKEN works but PRs it opens don't trigger workflows.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # readme.txt can't hold release-please markers, so copy the new version into its "Stable tag" on the release PR.
      - name: Sync readme.txt Stable tag on the release PR
        if: ${{ steps.release.outputs.pr }}
        env:
          BRANCH: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
        run: |
          git clone --depth 1 --branch "$BRANCH" \
            "https://x-access-token:${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" pr
          cd pr
          php bin/sync-version.php
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore: sync readme.txt stable tag"
            git push origin "HEAD:$BRANCH"
          fi

  zip:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      # Until kayko/mulla-php is on Packagist, the path repository (../mulla-php) supplies it.
      - name: Check out mulla-php
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/mulla-php-sdk
          token: ${{ secrets.MULLA_PHP_TOKEN }}
          path: mulla-php
      - name: Move mulla-php next to this repo
        run: mv mulla-php ../mulla-php
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: zip
          coverage: none
      # --no-dev: the zip ships only the plugin and vendor-prefixed/ (built by the post-install prefix script).
      - run: composer install --no-dev --no-interaction --no-progress --prefer-dist
      - run: php bin/sync-version.php --check
      - run: php bin/build-zip.php
      - name: Attach the zip to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" build/*.zip --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: mulla-payments-${{ needs.release-please.outputs.version }}
          path: build/*.zip

  # Publishes to the WordPress.org plugin directory. Off until the plugin is approved: then add the
  # SVN_USERNAME / SVN_PASSWORD secrets and set the repository variable WPORG_DEPLOY to "true".
  wordpress-org:
    needs: [release-please, zip]
    if: ${{ needs.release-please.outputs.release_created == 'true' && vars.WPORG_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - name: Check out mulla-php
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/mulla-php-sdk
          token: ${{ secrets.MULLA_PHP_TOKEN }}
          path: mulla-php
      - name: Move mulla-php next to this repo
        run: mv mulla-php ../mulla-php
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - run: composer install --no-dev --no-interaction --no-progress --prefer-dist
      # Deploys the working tree minus .distignore (vendor-prefixed/ included, vendor/ excluded) to SVN trunk + tags/<version>.
      - uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: mulla-payments
          VERSION: ${{ needs.release-please.outputs.version }}
          ASSETS_DIR: .wordpress-org
