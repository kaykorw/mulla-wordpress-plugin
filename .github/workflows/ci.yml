name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    name: PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4
      # Until kayko/mulla-php is on Packagist, the path repository (../mulla-php) supplies it.
      # mulla-php-sdk is private: MULLA_PHP_TOKEN is a fine-grained token with read access to it.
      - name: Check out mulla-php
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/mulla-php-sdk
          token: ${{ secrets.MULLA_PHP_TOKEN }}
          path: mulla-php
      - name: Move mulla-php next to this repo
        run: mv mulla-php ../mulla-php
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, mbstring, zip
          coverage: none
      - run: composer update --no-interaction --no-progress --prefer-dist
      - run: composer test

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Until kayko/mulla-php is on Packagist, the path repository (../mulla-php) supplies it.
      # mulla-php-sdk is private: MULLA_PHP_TOKEN is a fine-grained token with read access to it.
      - name: Check out mulla-php
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/mulla-php-sdk
          token: ${{ secrets.MULLA_PHP_TOKEN }}
          path: mulla-php
      - name: Move mulla-php next to this repo
        run: mv mulla-php ../mulla-php
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: zip
          coverage: none
      - run: composer update --no-interaction --no-progress --prefer-dist
      - run: composer cs
      - run: composer analyse
      - run: php -l views/settings-page.php && php -l uninstall.php && php -l mulla-payments.php
      - run: php bin/build-zip.php
      - uses: actions/upload-artifact@v4
        with:
          name: mulla-payments
          path: build/*.zip
